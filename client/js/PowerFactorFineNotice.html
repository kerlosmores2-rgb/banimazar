<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إخطار غرامة معامل القدرة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #fdf2f2; margin: 0; padding: 20px; direction: rtl; }
        
        .entry-card { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-top: 6px solid #e74c3c; margin-bottom: 30px; }
        .section-title { color: #c0392b; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; }
        
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; color: #444; }
        input, select, textarea { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; background: #f9f9f9; }
        
        .asset-info-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-top: 10px; font-size: 0.9rem; }
        
        .actions-bar { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-save { background: #27ae60; color: white; }
        .btn-edit { background: #2980b9; color: white; }
        .btn-delete { background: #c0392b; color: white; }
        .btn-print { background: #2c3e50; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* تنسيق الطباعة الرسمي */
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .entry-card { box-shadow: none; border: 1px solid #000; border-radius: 0; width: 100%; }
            .asset-info-box { border: 1px solid #000; background: none; }
            input, select { border: none; background: none; appearance: none; font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="entry-card">
    <div class="section-title no-print"><i class="fas fa-exclamation-circle"></i> تسجيل إخطار غرامة معامل القدرة</div>
    
    <div class="grid-layout">
        <div class="input-group">
            <label>اسم المحطة</label>
            <select id="stationId" onchange="checkPowerFactorPanel(this.value)">
                <option value="">-- اختر المحطة --</option>
            </select>
        </div>
        <div class="input-group">
            <label>كود المحطة</label>
            <input type="text" id="stationCode" readonly placeholder="سيظهر تلقائياً">
        </div>
    </div>

    <div id="panelStatusArea" class="asset-info-box">
        <strong>حالة لوحة معامل القدرة:</strong> 
        <span id="panelExistence">جاري الفحص...</span> | 
        <strong>وصف اللوحة:</strong> <span id="panelDesc">---</span> | 
        <strong>حالة التشغيل:</strong> <span id="panelCondition">---</span>
    </div>

    <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">

    <div class="grid-layout">
        <div class="input-group">
            <label>فترة المحاسبة (من)</label>
            <input type="date" id="dateFrom">
        </div>
        <div class="input-group">
            <label>فترة المحاسبة (إلى)</label>
            <input type="date" id="dateTo">
        </div>
        <div class="input-group">
            <label>الاستهلاك (KW)</label>
            <input type="number" id="energyConsumption" placeholder="أدخل كمية الكيلو وات">
        </div>
        <div class="input-group">
            <label>المتحصلات السنوية (جنيه)</label>
            <input type="number" id="annualRevenue" placeholder="قيمة المتحصلات">
        </div>
        <div class="input-group">
            <label>معامل القدرة الحالي</label>
            <input type="number" step="0.01" id="currentPF" placeholder="مثال: 0.75">
        </div>
        <div class="input-group">
            <label>قيمة الغرامة (جنيه)</label>
            <input type="number" id="fineAmount" style="color: #c0392b; font-weight: bold; font-size: 1.1rem;">
        </div>
    </div>

    <div class="actions-bar no-print">
        <button class="btn btn-save" onclick="saveNotice()"><i class="fas fa-save"></i> حفظ</button>
        <button class="btn btn-edit" onclick="editNotice()"><i class="fas fa-edit"></i> تعديل</button>
        <button class="btn btn-delete" onclick="deleteNotice()"><i class="fas fa-trash-alt"></i> حذف</button>
        <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> طباعة الإخطار</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://jvfbkoaeugkeoiccvnkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_n64Hnhuruc3Oeolj-Uwg9g_tu-otJlZ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function init() {
        const { data: stations } = await _supabase.from('stations').select('id, station_name, station_code').order('station_name');
        const s = document.getElementById('stationId');
        stations.forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.id;
            opt.text = item.station_name;
            opt.dataset.code = item.station_code;
            s.add(opt);
        });
    }

    // الدالة الذكية لجلب بيانات اللوحة من الأصول وتقارير المرور
    async function checkPowerFactorPanel(sid) {
        if (!sid) return;
        
        const sel = document.getElementById('stationId');
        document.getElementById('stationCode').value = sel.options[sel.selectedIndex].dataset.code;

        // 1. فحص وجود اللوحة في جدول الأصول
        const { data: asset } = await _supabase.from('station_assets')
            .select('asset_name, asset_description')
            .eq('station_id', sid)
            .ilike('asset_name', '%معامل قدرة%')
            .single();

        // 2. جلب حالة التشغيل من آخر تقرير مرور
        const { data: visit } = await _supabase.from('power_factor_panels')
            .select('is_working, visit_notes')
            .eq('station_id', sid)
            .order('created_at', { ascending: false })
            .limit(1)
            .single();

        if (asset) {
            document.getElementById('panelExistence').innerText = "يوجد لوحة مسجلة ✅";
            document.getElementById('panelDesc').innerText = asset.asset_description || asset.asset_name;
        } else {
            document.getElementById('panelExistence').innerText = "لا يوجد لوحة مسجلة ❌";
            document.getElementById('panelDesc').innerText = "غير متوفر";
        }

        if (visit) {
            document.getElementById('panelCondition').innerText = visit.is_working ? "تعمل بكفاءة" : "عطلانة / تحتاج صيانة";
            document.getElementById('panelCondition').style.color = visit.is_working ? "green" : "red";
        } else {
            document.getElementById('panelCondition').innerText = "لم يتم المرور عليها";
        }
    }

    async function saveNotice() {
        // منطق الحفظ في قاعدة البيانات
        alert("تم حفظ الإخطار بنجاح في سجلات فرع بني مزار");
    }

    function editNotice() { alert("تفعيل وضع التعديل..."); }
    function deleteNotice() { if(confirm("هل أنت متأكد من حذف هذا الإخطار؟")) alert("تم الحذف"); }

    init();
</script>
</body>
</html>
