<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://jvfbkoaeugkeoiccvnkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_n64Hnhuruc3Oeolj-Uwg9g_tu-otJlZ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. جلب المحطات عند البداية
    async function init() {
        const s = document.getElementById('stationId');
        try {
            const { data, error } = await _supabase.from('stations').select('id, station_name').order('station_name');
            if (error) throw error;
            s.innerHTML = '<option value="">-- اختر المحطة --</option>';
            data.forEach(item => s.innerHTML += `<option value="${item.id}">${item.station_name}</option>`);
        } catch (err) {
            console.error("Init Error:", err);
            s.innerHTML = '<option value="">خطأ في تحميل المحطات</option>';
        }
    }

    // 2. جلب الأصول من كل الجداول الفئوية (المصلحة)
// دالة جلب الأصول بناءً على المحطة المختارة
    async function fetchAssets(sid) {
        if(!sid) return;
        const a = document.getElementById('assetId');
        a.innerHTML = '<option value="">جاري فحص جميع الفئات...</option>';
        const stationIdInt = parseInt(sid);

        // تأكد من أسماء الجداول هنا (لو المفرد هو اللي شغال خليه مفرد)
        const assetTables = [
            { table: 'transformers', col: 'transformer_number', label: 'محول' },
            { table: 'generators', col: 'generator_number', label: 'مولد' },
            { table: 'electrical_panels', col: 'panel_number', label: 'لوحة' },
            { table: 'main_pumps', col: 'pump_number', label: 'طلمبة رئيسية' }, // تأكد: main_pump أم main_pumps
            { table: 'sub_pumps', col: 'pump_number', label: 'طلمبة غاطسة' },   // تأكد: sub_pump أم sub_pumps
            { table: 'other_assets', col: 'assets_number', label: 'أصل آخر' },
            { table: 'buildings', col: 'building_number', label: 'مبنى' }
        ];

        try {
            let allAssets = [];

            // تنفيذ الطلبات بشكل منفصل عشان لو جدول مش موجود ميوصلناش لـ Error كلي
            for (const item of assetTables) {
                try {
                    const { data, error } = await _supabase
                        .from(item.table)
                        .select('*')
                        .eq('station_id', stationIdInt);
                    
                    if (error) {
                        console.warn(`Table ${item.table} not found or error:`, error.message);
                        continue; 
                    }

                    if (data && data.length > 0) {
                        data.forEach(asset => {
                            allAssets.push({
                                id: asset.id,
                                name: asset[item.col] || "بدون اسم",
                                table: item.table,
                                col: item.col,
                                typeLabel: item.label
                            });
                        });
                    }
                } catch (innerErr) {
                    console.error(`Error in table ${item.table}:`, innerErr);
                }
            }

            if (allAssets.length > 0) {
                a.innerHTML = `<option value="">-- اختر المعدة (${allAssets.length}) --</option>`;
                allAssets.forEach(item => {
                    a.innerHTML += `<option value="${item.id}" data-table="${item.table}" data-col="${item.col}">${item.typeLabel}: ${item.name}</option>`;
                });
            } else {
                a.innerHTML = '<option value="">لا توجد أصول مسجلة لهذه المحطة</option>';
            }
        } catch (err) {
            console.error("General Error fetching assets:", err);
            a.innerHTML = '<option value="">خطأ في جلب البيانات</option>';
        }
    }

    // دالة توليد التقرير
    async function generateReport() {
        const assetSelect = document.getElementById('assetId');
        const aid = assetSelect.value; 
        const selected = assetSelect.options[assetSelect.selectedIndex];
        
        if(!aid) return alert("اختر المعدة أولاً");

        const tableName = selected.getAttribute('data-table');
        const columnName = selected.getAttribute('data-col');
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;

        if(!from || !to) return alert("حدد الفترة الزمنية");

        try {
            // جلب بيانات الأصل
            const { data: asset, error: assetErr } = await _supabase.from(tableName).select('*').eq('id', aid).single();
            if(assetErr) throw assetErr;

            const assetRealValue = asset[columnName]; 

            // جلب سجلات المرور (تأكد من الاسم الصحيح inspection_report أم inspection_reports)
            const { data: ins, error: insErr } = await _supabase
                .from('inspection_report') 
                .select('*')
                .eq('asset_id', assetRealValue);

            // جلب سجلات الأعطال
            const { data: flt, error: fltErr } = await _supabase
                .from('maintenance_tickets')
                .select('*')
                .eq('asset_id', assetRealValue);

            document.getElementById('reportContent').style.display = 'block';
            document.getElementById('assetDetails').innerHTML = `
                <div><strong>اسم المعدة:</strong> ${assetRealValue}</div>
                <div><strong>الفئة:</strong> ${tableName}</div>
                <div><strong>المواصفات:</strong> ${asset.rated_power_kva || asset.capacity || '---'}</div>
                <div><strong>الفترة:</strong> من ${from} إلى ${to}</div>
            `;

            const iBody = document.querySelector('#inspectionTable tbody');
            const fBody = document.querySelector('#faultTable tbody');
            iBody.innerHTML = ""; fBody.innerHTML = "";

            if (ins && ins.length > 0) {
                ins.filter(i => {
                    const d = i.created_at.split('T')[0];
                    return d >= from && d <= to;
                }).forEach(i => {
                    const state = i.checklist_data?.state || '---';
                    const note = i.checklist_data?.note || '---';
                    iBody.innerHTML += `<tr>
                        <td>${i.created_at.split('T')[0]}</td>
                        <td>${state}</td>
                        <td>${note}</td>
                        <td>${i.inspector_name || '---'}</td>
                    </tr>`;
                });
            }

            if (flt && flt.length > 0) {
                flt.filter(f => {
                    const d = f.created_at.split('T')[0];
                    return d >= from && d <= to;
                }).forEach(f => {
                    fBody.innerHTML += `<tr>
                        <td>${f.created_at.split('T')[0]}</td>
                        <td>${f.fault_description || '---'}</td>
                        <td>${f.repair_action || '---'}</td>
                        <td>${f.spare_part || '---'}</td>
                        <td>${f.stauts || '---'}</td>
                    </tr>`;
                });
            }

            if (iBody.innerHTML === "") iBody.innerHTML = '<tr><td colspan="4">لا توجد سجلات مرور</td></tr>';
            if (fBody.innerHTML === "") fBody.innerHTML = '<tr><td colspan="5">لا توجد بلاغات أعطال</td></tr>';

            setTimeout(() => { window.print(); }, 1000);
            
        } catch (err) {
            console.error("Report Error:", err);
            alert("حدث خطأ أثناء جلب البيانات.");
        }
    }



    
    // 3. توليد التقرير التاريخي
    async function generateReport() {
        const assetSelect = document.getElementById('assetId');
        const aid = assetSelect.value;
        const selected = assetSelect.options[assetSelect.selectedIndex];
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;

        if(!aid || !from || !to) return alert("برجاء استكمال البيانات");

        const tableName = selected.getAttribute('data-table');
        const columnName = selected.getAttribute('data-col');

        try {
            // جلب بيانات الأصل للحصول على القيمة النصية (مثلاً طلمبة 1)
            const { data: asset } = await _supabase.from(tableName).select('*').eq('id', aid).single();
            const assetRealValue = asset[columnName];

            // جلب سجلات المرور (inspection_report) بالربط النصي
            const { data: ins } = await _supabase.from('inspection_report').select('*').eq('asset_id', assetRealValue);

            // جلب سجلات الأعطال (maintenance_tickets) بالربط النصي
            const { data: flt } = await _supabase.from('maintenance_tickets').select('*').eq('asset_id', assetRealValue);

            // عرض وتعبئة التقرير
            document.getElementById('reportContent').style.display = 'block';
            document.getElementById('assetDetails').innerHTML = `
                <div><strong>اسم المعدة:</strong> ${assetRealValue}</div>
                <div><strong>الفئة:</strong> ${tableName}</div>
                <div><strong>المواصفات:</strong> ${asset.rated_power_kva || asset.capacity || '---'}</div>
                <div><strong>الفترة الزمنية:</strong> من ${from} إلى ${to}</div>
            `;

            const insBody = document.querySelector('#inspectionTable tbody');
            const fltBody = document.querySelector('#faultTable tbody');
            insBody.innerHTML = ""; 
            fltBody.innerHTML = "";

            // تعبئة جدول المرور (التعامل مع JSON)
            if (ins) {
                const filtered = ins.filter(i => {
                    const d = i.created_at.split('T')[0];
                    return d >= from && d <= to;
                });
                filtered.forEach(row => {
                    insBody.innerHTML += `<tr>
                        <td>${row.created_at.split('T')[0]}</td>
                        <td>${row.checklist_data?.state || '---'}</td>
                        <td>${row.checklist_data?.note || '---'}</td>
                        <td>${row.inspector_name || '---'}</td>
                    </tr>`;
                });
            }

            // تعبئة جدول الأعطال
            if (flt) {
                const filtered = flt.filter(f => {
                    const d = f.created_at.split('T')[0];
                    return d >= from && d <= to;
                });
                filtered.forEach(row => {
                    fltBody.innerHTML += `<tr>
                        <td>${row.created_at.split('T')[0]}</td>
                        <td>${row.fault_description || '---'}</td>
                        <td>${row.repair_action || '---'}</td>
                        <td>${row.spare_part || '---'}</td>
                        <td>${row.stauts || '---'}</td>
                    </tr>`;
                });
            }

            if (insBody.innerHTML === "") insBody.innerHTML = '<tr><td colspan="4">لا توجد سجلات مرور</td></tr>';
            if (fltBody.innerHTML === "") fltBody.innerHTML = '<tr><td colspan="5">لا توجد بلاغات أعطال</td></tr>';

            setTimeout(() => window.print(), 1000);

        } catch (err) {
            console.error(err);
            alert("حدث خطأ أثناء جلب بيانات التقرير");
        }
    }

    init();
</script>
