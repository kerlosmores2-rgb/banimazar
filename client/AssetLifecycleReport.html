<script>
    const SUPABASE_URL = 'https://jvfbkoaeugkeoiccvnkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_n64Hnhuruc3Oeolj-Uwg9g_tu-otJlZ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // دالة التشغيل الأولي لجلب المحطات
    async function init() {
        try {
            const { data, error } = await _supabase.from('stations').select('id, station_name').order('station_name');
            if (error) throw error;
            const s = document.getElementById('stationId');
            s.innerHTML = '<option value="">-- اختر المحطة --</option>';
            data.forEach(item => s.innerHTML += `<option value="${item.id}">${item.station_name}</option>`);
        } catch (err) {
            console.error("Init Error:", err);
            document.getElementById('stationId').innerHTML = '<option value="">خطأ في تحميل المحطات</option>';
        }
    }

    // دالة جلب الأصول بناءً على المحطة المختارة
    async function fetchAssets(sid) {
        if(!sid) return;
        const a = document.getElementById('assetId');
        a.innerHTML = '<option value="">جاري فحص جميع الفئات...</option>';

        const stationIdInt = parseInt(sid);

        // المصفوفة الصحيحة والنهائية للأسماء التي ذكرتها يا هندسة
        const assetTables = [
            { table: 'transformers', col: 'transformer_number', label: 'محول' },
            { table: 'generators', col: 'generator_number', label: 'مولد' },
            { table: 'electrical_panels', col: 'panel_number', label: 'لوحة' },
            { table: 'main_pump', col: 'pump_number', label: 'طلمبة رئيسية' },
            { table: 'sub_pump', col: 'pump_number', label: 'طلمبة غاطسة' },
            { table: 'other_assets', col: 'assets_number', label: 'أصل آخر' },
            { table: 'buildings', col: 'building_number', label: 'مبنى' }
        ];

        try {
            const requests = assetTables.map(item => 
                _supabase.from(item.table).select('*').eq('station_id', stationIdInt)
            );

            const results = await Promise.all(requests);
            let allAssets = [];

            results.forEach((res, index) => {
                if (res.data && res.data.length > 0) {
                    const tableInfo = assetTables[index];
                    res.data.forEach(asset => {
                        allAssets.push({
                            id: asset.id,
                            name: asset[tableInfo.col] || "بدون اسم",
                            table: tableInfo.table,
                            col: tableInfo.col,
                            typeLabel: tableInfo.label
                        });
                    });
                }
            });

            if (allAssets.length > 0) {
                allAssets.sort((a, b) => a.typeLabel.localeCompare(b.typeLabel));
                a.innerHTML = `<option value="">-- اختر المعدة (${allAssets.length}) --</option>`;
                allAssets.forEach(item => {
                    a.innerHTML += `<option value="${item.id}" data-table="${item.table}" data-col="${item.col}">
                        ${item.typeLabel}: ${item.name}
                    </option>`;
                });
            } else {
                a.innerHTML = '<option value="">لا توجد أصول مسجلة</option>';
            }
        } catch (err) {
            console.error("Error fetching assets:", err);
            a.innerHTML = '<option value="">خطأ في جلب البيانات</option>';
        }
    }

    // دالة توليد التقرير
    async function generateReport() {
        const assetSelect = document.getElementById('assetId');
        const aid = assetSelect.value;
        const selectedOption = assetSelect.options[assetSelect.selectedIndex];
        
        if(!aid || aid === "") return alert("برجاء اختيار المعدة أولاً");

        const tableName = selectedOption.getAttribute('data-table');
        const columnName = selectedOption.getAttribute('data-col');
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;

        if(!from || !to) return alert("برجاء تحديد الفترة الزمنية");

        try {
            // 1. جلب بيانات الأصل
            const { data: asset, error: assetErr } = await _supabase.from(tableName).select('*').eq('id', aid).single();
            if(assetErr) throw assetErr;

            // 2. جلب سجلات المرور والأعطال
            const { data: ins } = await _supabase.from('inspection_reports').select('*')
                .eq('asset_id', aid).gte('created_at', from).lte('created_at', to).order('created_at');

            const { data: flt } = await _supabase.from('fault_reports').select('*')
                .eq('asset_id', aid).gte('report_date', from).lte('report_date', to).order('report_date');

            // عرض البيانات في التقرير
            document.getElementById('reportContent').style.display = 'block';
            document.getElementById('assetDetails').innerHTML = `
                <div><strong>اسم المعدة:</strong> ${asset[columnName]}</div>
                <div><strong>نوع الفئة:</strong> ${tableName}</div>
                <div><strong>المواصفات:</strong> ${asset.rated_power_kva || asset.capacity || '---'}</div>
                <div><strong>الفترة:</strong> من ${from} إلى ${to}</div>
            `;

            // تنظيف الجداول قبل التعبئة
            document.querySelector('#inspectionTable tbody').innerHTML = "";
            document.querySelector('#faultTable tbody').innerHTML = "";

            // تعبئة جدول المرور
            ins?.forEach(i => {
                document.querySelector('#inspectionTable tbody').innerHTML += `
                    <tr>
                        <td>${new Date(i.created_at).toLocaleDateString('ar-EG')}</td>
                        <td>${i.status || '---'}</td>
                        <td>${i.notes || 'لا يوجد'}</td>
                        <td>${i.inspector_name || '---'}</td>
                    </tr>`;
            });

            // تعبئة جدول الأعطال
            flt?.forEach(f => {
                document.querySelector('#faultTable tbody').innerHTML += `
                    <tr>
                        <td>${new Date(f.report_date).toLocaleDateString('ar-EG')}</td>
                        <td>${f.fault_description}</td>
                        <td>${f.repair_action || 'تحت الإصلاح'}</td>
                        <td>${f.spare_parts || '---'}</td>
                        <td>${f.repair_status}</td>
                    </tr>`;
            });

            setTimeout(() => { window.print(); }, 500);
            
        } catch (err) {
            console.error("Report Error:", err);
            alert("حدث خطأ أثناء توليد التقرير");
        }
    }

    // تشغيل الدالة الأولى عند تحميل الصفحة
    init();
</script>
