<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير استهلاك المياه النظيفة (خدمات)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; direction: rtl; }
        .filter-card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; border-right: 5px solid #2ecc71; }
        .inputs-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        label { font-weight: bold; font-size: 0.85rem; color: #7f8c8d; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Cairo'; }
        .btn-run { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }

        /* تنسيق التقرير للطباعة */
        .print-layout { background: white; padding: 35px; border: 1px solid #000; display: none; min-height: 297mm; }
        .header-section { text-align: center; border-bottom: 2px solid #2ecc71; padding-bottom: 10px; margin-bottom: 20px; }
        .station-box { background: #f9f9f9; padding: 15px; border: 1px solid #eee; margin-bottom: 20px; display: flex; justify-content: space-between; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f2f2f2 !important; border: 1px solid #000; padding: 8px; font-size: 13px; }
        td { border: 1px solid #000; padding: 8px; text-align: center; font-size: 12px; }
        .footer-totals { background: #e8f8f5; font-weight: bold; }

        @media print {
            .no-print { display: none !important; }
            .print-layout { display: block !important; border: none; padding: 0; }
            body { background: white; }
            @page { size: A4 portrait; margin: 10mm; }
        }
    </style>
</head>
<body>

<div class="filter-card no-print">
    <h3><i class="fas fa-faucet" style="color: #2ecc71;"></i> متابعة استهلاك مياه الشرب والنظافة</h3>
    <div class="inputs-row">
        <div>
            <label>المحطة</label>
            <select id="stSelect">
                <option value="">جاري التحميل...</option>
            </select>
        </div>
        <div>
            <label>من تاريخ</label>
            <input type="date" id="startD">
        </div>
        <div>
            <label>إلى تاريخ</label>
            <input type="date" id="endD">
        </div>
        <div>
            <button class="btn-run" onclick="generateDomesticWaterReport()"><i class="fas fa-file-alt"></i> عرض سجل الاستهلاك</button>
        </div>
    </div>
</div>

<div id="finalReport" class="print-layout">
    <div class="header-section">
        <h2 style="margin:0; color:#2ecc71;">شركة مياه الشرب والصرف الصحي بالمنيا</h2>
        <h3 style="margin:5px;">فرع بني مزار - سجل استهلاك مياه الخدمات</h3>
    </div>

    <div id="stDataBox" class="station-box">
        </div>

    <table>
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>قراءة العداد الحالية (م3)</th>
                <th>الاستهلاك خلال الفترة (م3)</th>
                <th>ملاحظات (نظافة/أعطال/تبريد)</th>
            </tr>
        </thead>
        <tbody id="domesticBody">
            </tbody>
        <tfoot>
            <tr class="footer-totals">
                <td colspan="2">إجمالي الاستهلاك النظيف خلال الفترة</td>
                <td id="totalLitres">0</td>
                <td>م3</td>
            </tr>
        </tfoot>
    </table>

    <div style="margin-top: 40px; display: flex; justify-content: space-around;">
        <p>توقيع مسؤول المحطة</p>
        <p>مدير الإدارة</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://jvfbkoaeugkeoiccvnkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_n64Hnhuruc3Oeolj-Uwg9g_tu-otJlZ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function init() {
        const { data } = await _supabase.from('stations').select('id, station_name, station_code').order('station_name');
        const s = document.getElementById('stSelect');
        s.innerHTML = '<option value="">-- اختر المحطة --</option>';
        data.forEach(item => {
            s.innerHTML += `<option value="${item.id}" data-code="${item.station_code}">${item.station_name}</option>`;
        });
    }

    async function generateDomesticWaterReport() {
        const sid = document.getElementById('stSelect').value;
        const from = document.getElementById('startD').value;
        const to = document.getElementById('endD').value;

        if (!sid || !from || !to) return alert("برجاء إكمال حقول البحث");

        const sel = document.getElementById('stSelect');
        const stName = sel.options[sel.selectedIndex].text;
        const stCode = sel.options[sel.selectedIndex].getAttribute('data-code');

        // جلب البيانات من جدول 'domestic_water_readings'
        const { data: readings } = await _supabase.from('domestic_water_readings')
            .select('*').eq('station_id', sid)
            .gte('reading_date', from).lte('reading_date', to)
            .order('reading_date');

        document.getElementById('finalReport').style.display = 'block';
        document.getElementById('stDataBox').innerHTML = `
            <span><strong>المحطة:</strong> ${stName}</span>
            <span><strong>كود المحطة:</strong> ${stCode || '---'}</span>
            <span><strong>الفترة:</strong> من ${from} إلى ${to}</span>
        `;

        let html = '';
        let totalSum = 0;

        readings.forEach(r => {
            const cons = parseFloat(r.consumption || 0);
            totalSum += cons;
            html += `
                <tr>
                    <td>${r.reading_date}</td>
                    <td>${r.current_reading.toLocaleString()}</td>
                    <td>${cons.toLocaleString()}</td>
                    <td>${r.notes || 'استخدام دوري'}</td>
                </tr>`;
        });

        document.getElementById('domesticBody').innerHTML = html || '<tr><td colspan="4">لا توجد قراءات مسجلة</td></tr>';
        document.getElementById('totalLitres').innerText = totalSum.toLocaleString();

        setTimeout(() => { window.print(); }, 500);
    }

    init();
</script>
</body>
</html>
