<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نظام إدارة محطات الصرف الصحي - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* استرجاع كافة تنسيقاتك الأصلية من ملف (10).html */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a2b3e 0%, #0f3b4f 50%, #144d64 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .main-layout { display: flex; gap: 25px; flex-wrap: wrap; }
        .sidebar {
            width: 280px; background: rgba(10, 40, 55, 0.9); backdrop-filter: blur(12px);
            border-radius: 25px; padding: 25px 0; height: fit-content;
            border: 1px solid rgba(0, 212, 255, 0.3); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-height: 90vh; overflow-y: auto;
        }
        .sidebar-logo { text-align: center; padding: 0 20px 20px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; }
        .sidebar .nav-item {
            display: flex; align-items: center; gap: 15px; padding: 12px 25px;
            color: #ddd; transition: all 0.3s; border-right: 4px solid transparent; cursor: pointer;
        }
        .sidebar .nav-item.active { background: rgba(0, 212, 255, 0.2); color: #00d4ff; border-right-color: #00d4ff; }
        
        /* تنسيق قسم التقارير الجديد */
        .nav-group-title { padding: 15px 25px 5px; font-size: 0.8rem; color: #00d4ff; font-weight: bold; opacity: 0.8; }
        .sub-nav { background: rgba(0,0,0,0.2); margin: 5px 0; }
        .sub-nav .nav-item { padding-right: 35px; font-size: 0.85rem; }

        .content { flex: 1; min-width: 300px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* حل مشكلة اللون الأبيض في التقارير */
        .iframe-wrapper {
            background: #ffffff; /* خلفية بيضاء فقط للتقارير لضمان وضوح الكلام */
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(0, 212, 255, 0.3);
        }
        iframe { width: 100%; height: 800px; border: none; display: block; }

        /* ستايل كروت الإحصائيات (الرئيسية) */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-card {
            background: rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 25px;
            text-align: center; border: 1px solid rgba(0, 212, 255, 0.2); transition: 0.3s;
        }
        .stat-card i { font-size: 2rem; color: #00d4ff; margin-bottom: 15px; }
        .stat-card h3 { font-size: 2rem; margin-bottom: 5px; }

        .menu-toggle { display: none; position: fixed; top: 15px; right: 15px; z-index: 1001; background: #00d4ff; border: none; border-radius: 10px; width: 40px; height: 40px; }
        @media (max-width: 768px) { .menu-toggle { display: block; } .sidebar { position: fixed; right: -300px; z-index: 1000; } .sidebar.open { right: 0; } }
    </style>
</head>
<body>

<button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

<div class="container">
    <div class="main-layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-water" style="font-size: 2rem; color: #00d4ff;"></i>
                <h3>نظام إدارة المحطات</h3>
            </div>
            
            <div class="nav-item active" data-page="dashboard"><i class="fas fa-home"></i><span>الرئيسية</span></div>
            <div class="nav-item" data-page="stations"><i class="fas fa-building"></i><span>المحطات</span></div>
            <div class="nav-item" data-page="assets"><i class="fas fa-microchip"></i><span>الأصول</span></div>
            <div class="nav-item" data-page="maintenance"><i class="fas fa-wrench"></i><span>الصيانة</span></div>

            <div class="nav-group-title">التقارير الفنية والمالية</div>
            <div class="sub-nav">
                <div class="nav-item" data-page="asset-status-report"><i class="fas fa-file-alt"></i><span>حالة أصل</span></div>
                <div class="nav-item" data-page="MonthlyPerformanceReport"><i class="fas fa-chart-line"></i><span>كفاءة التشغيل</span></div>
                <div class="nav-item" data-page="PowerFactorFineNotice"><i class="fas fa-file-invoice-dollar"></i><span>إخطار غرامة</span></div>
                <div class="nav-item" data-page="PowerFactorFinesReport"><i class="fas fa-history"></i><span>سجل الغرامات</span></div>
                <div class="nav-item" data-page="PowerFactorReport"><i class="fas fa-bolt"></i><span>لوحات القدرة</span></div>
                <div class="nav-item" data-page="staff-report"><i class="fas fa-users"></i><span>العاملين</span></div>
            </div>

            <div class="nav-item" id="logoutBtn" style="color: #ff6b6b;"><i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span></div>
        </div>

        <div class="content">
            <div class="header">
                <h1 id="pageTitle">لوحة التحكم</h1>
                <div style="background: rgba(0,212,255,0.2); padding: 8px 20px; border-radius: 50px;">
                    <span id="userName">جاري التحميل...</span>
                </div>
            </div>
            <div id="pageContent"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api.js"></script>
<script>
    // استرجاع منطق التحميل الأصلي لضمان عمل الإحصائيات والمحطات
    async function loadDashboard() {
        document.getElementById('pageContent').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><i class="fas fa-building"></i><h3 id="count-stations">-</h3><p>المحطات</p></div>
                <div class="stat-card"><i class="fas fa-microchip"></i><h3 id="count-assets">-</h3><p>الأصول</p></div>
                <div class="stat-card"><i class="fas fa-tools"></i><h3 id="count-maintenance">-</h3><p>أعطال مفتوحة</p></div>
            </div>
        `;
        // استدعاء دالة جلب البيانات من ملف api.js الخاص بك
        if (typeof fetchStats === 'function') fetchStats(); 
    }

    function loadPage(page) {
        const pageTitle = document.getElementById('pageTitle');
        if (page === 'dashboard') {
            pageTitle.innerText = "لوحة التحكم";
            loadDashboard();
        } else {
            // حل مشكلة 404: التأكد من أسماء الملفات
            pageTitle.innerText = "عرض التقرير";
            document.getElementById('pageContent').innerHTML = `
                <div class="iframe-wrapper">
                    <iframe src="${page}.html" onerror="this.innerHTML='خطأ في تحميل الصفحة'"></iframe>
                </div>
            `;
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        // فحص هوية المستخدم من api.js
        if (typeof checkAuth === 'function') await checkAuth();
        const user = (typeof getCurrentUser === 'function') ? getCurrentUser() : null;
        if (user) document.getElementById('userName').innerText = `مرحباً ${user.full_name || 'بك'}`;

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const page = item.getAttribute('data-page');
                if (page) {
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                    loadPage(page);
                }
            });
        });

        document.getElementById('logoutBtn').onclick = () => { if(typeof logout === 'function') logout(); };
        document.getElementById('menuToggle').onclick = () => { document.getElementById('sidebar').classList.toggle('open'); };

        loadPage('dashboard');
    });
</script>
</body>
</html>
