<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير استهلاك الكهرباء التفصيلي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background: #f0f4f8; color: #333; margin: 0; padding: 20px; direction: rtl; }
        .filter-box { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; border-top: 5px solid #27ae60; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        label { font-weight: bold; font-size: 0.9rem; color: #2c3e50; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: 'Cairo'; }
        .btn-calc { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 16px; font-weight: bold; }
        
        .report-frame { background: white; padding: 30px; border: 1px solid #333; display: none; min-height: 297mm; }
        .report-header { text-align: center; border-bottom: 2px double #333; padding-bottom: 15px; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #e8f5e9 !important; border: 1px solid #000; padding: 10px; font-size: 13px; }
        td { border: 1px solid #000; padding: 8px; text-align: center; font-size: 12px; }
        .total-row { background: #f1f8e9; font-weight: bold; }
        .grand-total { background: #27ae60; color: white; font-size: 14px; }

        @media print {
            .no-print { display: none !important; }
            .report-frame { display: block !important; border: none; padding: 0; }
            body { background: white; }
            @page { size: A4 portrait; margin: 10mm; }
        }
    </style>
</head>
<body>

<div class="filter-box no-print">
    <h3><i class="fas fa-bolt" style="color: #f1c40f;"></i> استخراج تقرير استهلاك الطاقة</h3>
    <div class="grid-inputs">
        <div>
            <label>المحطة</label>
            <select id="stationId">
                <option value="">جاري تحميل المحطات...</option>
            </select>
        </div>
        <div>
            <label>من شهر</label>
            <input type="month" id="dateFrom">
        </div>
        <div>
            <label>إلى شهر</label>
            <input type="month" id="dateTo">
        </div>
        <div>
            <label>سعر الكيلو وات (جنيه)</label>
            <input type="number" id="unitPrice" value="1.60" step="0.1">
        </div>
    </div>
    <button class="btn-calc" onclick="generateElectricityReport()">توليد تقرير الاستهلاك والتكلفة</button>
</div>

<div id="reportArea" class="report-frame">
    <div class="report-header">
        <h2>شركة مياه الشرب والصرف الصحي بالمنيا</h2>
        <h3>قطاع التشغيل والصيانة - إدارة بني مزار</h3>
        <h4 id="reportTitle">تقرير استهلاك الكهرباء</h4>
    </div>

    <div style="margin-bottom: 20px; display: flex; justify-content: space-between;">
        <span id="stName">المحطة: ---</span>
        <span id="stCode">الكود: ---</span>
    </div>

    <table>
        <thead>
            <tr>
                <th rowspan="2">الشهر / السنة</th>
                <th colspan="2">المحول رقم (1)</th>
                <th colspan="2">المحول رقم (2)</th>
                <th colspan="2">إجمالي المحولين</th>
            </tr>
            <tr>
                <th>ك.و.س</th>
                <th>القيمة (جنيه)</th>
                <th>ك.و.س</th>
                <th>القيمة (جنيه)</th>
                <th>ك.و.س</th>
                <th>القيمة (جنيه)</th>
            </tr>
        </thead>
        <tbody id="reportBody">
            </tbody>
        <tfoot id="reportFooter">
            </tfoot>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://jvfbkoaeugkeoiccvnkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_n64Hnhuruc3Oeolj-Uwg9g_tu-otJlZ';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function init() {
        const { data } = await _supabase.from('stations').select('id, station_name, station_code').order('station_name');
        const s = document.getElementById('stationId');
        s.innerHTML = '<option value="">-- اختر المحطة --</option>';
        data.forEach(item => {
            s.innerHTML += `<option value="${item.id}" data-code="${item.station_code}">${item.station_name}</option>`;
        });
    }

    async function generateElectricityReport() {
        const sid = document.getElementById('stationId').value;
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;
        const price = parseFloat(document.getElementById('unitPrice').value);

        if (!sid || !from || !to) return alert("يرجى اختيار المحطة والفترة الزمنية");

        const sel = document.getElementById('stationId');
        const stationName = sel.options[sel.selectedIndex].text;
        const stationCode = sel.options[sel.selectedIndex].getAttribute('data-code');

        // جلب بيانات القراءات من جدول 'electricity_readings'
        const { data: readings, error } = await _supabase.from('electricity_readings')
            .select('*')
            .eq('station_id', sid)
            .gte('reading_date', from + '-01')
            .lte('reading_date', to + '-31')
            .order('reading_date');

        if (error) return alert("خطأ في جلب البيانات");

        document.getElementById('reportArea').style.display = 'block';
        document.getElementById('stName').innerText = "المحطة: " + stationName;
        document.getElementById('stCode').innerText = "الكود: " + (stationCode || '---');

        let html = '';
        let sumTrans1 = 0, sumTrans2 = 0;

        readings.forEach(r => {
            const t1 = r.trans1_consumption || 0;
            const t2 = r.trans2_consumption || 0;
            const totalKW = t1 + t2;
            
            sumTrans1 += t1;
            sumTrans2 += t2;

            html += `
                <tr>
                    <td>${r.reading_date.substring(0, 7)}</td>
                    <td>${t1.toLocaleString()}</td>
                    <td>${(t1 * price).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td>${t2.toLocaleString()}</td>
                    <td>${(t2 * price).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td style="font-weight:bold;">${totalKW.toLocaleString()}</td>
                    <td style="font-weight:bold;">${(totalKW * price).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                </tr>`;
        });

        document.getElementById('reportBody').innerHTML = html;

        const grandKW = sumTrans1 + sumTrans2;
        document.getElementById('reportFooter').innerHTML = `
            <tr class="total-row">
                <td>الإجماليات خلال الفترة</td>
                <td>${sumTrans1.toLocaleString()}</td>
                <td>${(sumTrans1 * price).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td>${sumTrans2.toLocaleString()}</td>
                <td>${(sumTrans2 * price).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td>${grandKW.toLocaleString()}</td>
                <td>${(grandKW * price).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
            </tr>
            <tr class="grand-total">
                <td colspan="5">إجمالي تكلفة الكهرباء المستحقة (جنيه مصري)</td>
                <td colspan="2" style="font-size:18px;">${(grandKW * price).toLocaleString(undefined, {minimumFractionDigits: 2})} ج.م</td>
            </tr>
        `;

        // فتح نافذة الطباعة أوتوماتيكياً
        setTimeout(() => { window.print(); }, 500);
    }

    init();
</script>
</body>
</html>
